  const a=knots[Math.max(0,i-1)],b=knots[i],c=knots[i+1],d=knots[Math.min(knots.length-1,i+2)];

   let t=j/n,t2=t*t,t3=t2*t;

function outline(points,weight,seed,smooth,pct){

// V0.5: signature segments are single connected pen gestures, with preserved letter-scale loops.
function generate(input,opt){
 const name=(input||'Alan Wake').trim()||'Alan Wake';
 const segments=parseSegments(name);
 const writer=random(hash(name+'|signature-writer-v05'));
 const take=random(hash(name+'|'+opt.seed+'|subtle-take-v05'));
 const N=()=>normal(take);
 const structure=clamp((opt.struct??52)/100,0,1);
 const flow=clamp((opt.flow??72)/100,0,1);
 const micro=clamp((opt.micro??70)/100,0,1);
 const abbreviation=clamp(opt.ab/100,0,1);
 const tempo=clamp(opt.sp/100,0,1);
 const strokes=[], marks=[];
 let x=0, baseline=0, countLoops=0, countMicro=0, terminal=null, tailJoin=null;
 function v(a,b){return {x:a,y:b}}
 function smoothBridge(p0,p1,run=6){

 function sampleCubic(a,b,c,d,n){

 for(const stroke of strokes){
   const k0=N(),k1=N(),k2=N(),k3=N();
   const amp=(1-flow)*.36+.14;
   let distance=0;
   let prev=stroke.points[0];
   stroke.points=stroke.points.map((p,i)=>{
     if(i)distance+=Math.hypot(p.x-prev.x,p.y-prev.y);
     prev=p;
     const edge=(i===0||i===stroke.points.length-1)?0:.75;
     const xShift=edge*amp*(k0*Math.sin(distance/24+.4)+.26*k2*Math.sin(distance/11));
     const yShift=edge*amp*(k1*Math.sin(distance/26+.2)+.22*k3*Math.sin(distance/13));
     return v(p.x+xShift,p.y+yShift);
   });
 }
 // Terminal flourish: SAME polygon / SAME stroke, starting at the actual final
 // endpoint, with its cubic start tangent copied from the final body segment.
 if(strokes.length){
   const s=strokes[strokes.length-1],body=s.points,join=body[body.length-1];
   terminal=v(join.x,join.y);
   if(opt.fl>1){
     const T=tangent(body),strength=clamp(opt.fl/100,0,1),length=15+strength*71;
     // Hand leaves last lower-case stroke, continues along its existing direction,
     // then gradually sweeps right. No detached path or forced baseline reset.
     const bend=7+strength*13;
     const p1=v(join.x+T.x*bend,join.y+T.y*bend);
     const yLift=(5+strength*3)*(-.38+.18*N());
     const p2=v(join.x+length*.55,join.y+yLift+1.6);
     const end=v(join.x+length,join.y+yLift-3.2-strength*1.8);
     const samples=sampleCubic(join,p1,p2,end,Math.max(16,Math.round(length/2)));
     tailJoin=v(samples[0].x,samples[0].y); // exact equality by construction
     s.points.push(...samples.slice(1));
   }
 }
 return {strokes:strokes.concat(marks),segments:segments.length,loops:countLoops,micro:countMicro,marks:marks.length,terminal,tailJoin};
}

function render(name,opt){
 const data=generate(name,opt),strokes=data.strokes,all=[];
 for(const st of strokes){if(st.type==='stroke')all.push(...st.points);else all.push({x:st.x,y:st.y})}
 if(!all.length)all.push({x:0,y:0},{x:100,y:-20});
 let minX=Math.min(...all.map(p=>p.x))-3,maxX=Math.max(...all.map(p=>p.x))+3;
 let minY=Math.min(...all.map(p=>p.y))-3,maxY=Math.max(...all.map(p=>p.y))+3;
 const factor=Math.min(1.92,790/(maxX-minX),137/(maxY-minY));
 let ox=39-minX*factor,oy=112-(minY+maxY)*factor*.5;
 let paths=strokes.map(st=>{
  if(st.type==='dot')return '<circle cx="'+st.x.toFixed(3)+'" cy="'+st.y.toFixed(3)+'" r="'+st.r.toFixed(3)+'" fill="#242220"/>';
  if(st.type==='dash')return '<path d="M'+st.x.toFixed(3)+' '+st.y.toFixed(3)+' l'+st.dx.toFixed(3)+' '+st.dy.toFixed(3)+'" fill="none" stroke="#242220" stroke-width="'+opt.bw+'" stroke-linecap="round"/>';
  return '<path d="'+outline(st.points,opt.bw,st.seed,opt.sm/100,opt.pr)+'" fill="#242220"/>';
 }).join('');
 return{svg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-label="签名字迹"><rect width="880" height="220" fill="white"/><g transform="translate('+ox.toFixed(3)+' '+oy.toFixed(3)+') scale('+factor.toFixed(4)+')">'+paths+'</g></svg>',...data};
}
let seed=0,activeName='Alan Wake',lastSVG='';
function getOptions(){return {flow:+val('sig-flow').value,struct:+val('sig-struct').value,micro:+val('sig-micro').value,ab:+val('sig-ab').value,sp:+val('sig-sp').value,fl:+val('sig-fl').value,sm:+val('sig-sm').value,bw:+val('sig-bw').value,pr:+val('sig-pr').value,dash:+val('sig-dash').value,loops:{g:val('sig-g').checked,d:val('sig-d').checked,l:val('sig-l').checked},seed}}
function update(){
 const o=getOptions(),name=val('sig-name').value;
 const out=render(name,o),view=$('#sig-view');
 view.innerHTML=out.svg;lastSVG=out.svg;
 $('#sig-metrics').textContent=out.segments+' 段起笔 · '+out.loops+' 个大回环 · '+out.marks+' 个点划';
 $('#sig-seed').textContent='S'+String(seed).padStart(3,'0');
 for(const [key,suffix] of [['flow','%'],['struct','%'],['micro','%'],['ab','%'],['sp','%'],['fl','%'],['sm','%'],['dash','%'],['pr','%']])$('#sig-'+key+'v').textContent=o[key]+suffix;
 $('#sig-bwv').textContent=o.bw.toFixed(2);
 $('#sig-nameprint').textContent=name||'Alan Wake';
}
root.querySelectorAll('input').forEach(input=>input.addEventListener('input',update));
$('#sig-again').addEventListener('click',()=>{seed++;update()});
$('#sig-reset').addEventListener('click',()=>{seed=0;for(const [id,value] of Object.entries({'sig-flow':'89','sig-struct':'24','sig-micro':'70','sig-ab':'94','sig-sp':'79','sig-fl':'35','sig-sm':'94','sig-bw':'1.15','sig-pr':'4','sig-dash':'42','sig-name':'Margie Golding'}))val(id).value=value;for(const x of ['g','d','l'])val('sig-'+x).checked=false;update()});
root.querySelectorAll('[data-example]').forEach(btn=>btn.addEventListener('click',()=>{val('sig-name').value=btn.dataset.example;seed=0;update()}));
$('#sig-save').addEventListener('click',()=>{let blob=new Blob([lastSVG],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='signature-'+(val('sig-name').value.trim().replace(/[^a-zA-Z0-9_-]+/g,'-')||'preview')+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)});
update();
window.SignatureMotionLabV5={render,generate,getOptions,update};
})();
</script></body></html>
